version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: omni
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: omni
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./database/migrations:/migrations
    ports:
      - "5432:5432"
    networks:
      - omni-network-dev

  migrator:
    image: postgres:16
    depends_on:
      - db
    environment:
      PGPASSWORD: omni
    command: ["sh", "-c", "sleep 10 && psql -h db -U omni -d omni -f /migrations/001_init.sql || echo 'Migration complete'"]
    volumes:
      - ./database/migrations:/migrations
    networks:
      - omni-network-dev
    restart: "no"

  # Only run database for development
  # Individual services can be run with `pnpm dev` locally

volumes:
  postgres_data_dev:

networks:
  omni-network-dev:
    driver: bridge
